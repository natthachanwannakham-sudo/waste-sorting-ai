<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบคัดแยกขยะด้วย AI</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#1d2b22;--mute:#5d6b62;--line:#d9e0d6;--accent:#2f7d4f;
--y:#f5b800;--b:#1f4e9c;--g:#2f9e57;--r:#d64545;--n:#8a948d}
@media (prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1b2620;--ink:#eaf1ec;--mute:#a3b1a8;--line:#2d3b33;--accent:#5fc088}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;min-height:100vh}
main{max-width:720px;margin:0 auto}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
#view{min-height:240px;display:flex;align-items:center;justify-content:center;background:#0002;border-radius:8px;overflow:hidden}
#view canvas,#view img{max-width:100%;max-height:360px;border-radius:8px}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
#result{margin:16px 0;border-radius:12px;padding:20px;text-align:center;color:#fff;background:var(--n);transition:background .2s}
#result .big{font-size:2rem;font-weight:800;line-height:1.2}
#result .pct{font-size:1.1rem;opacity:.95;margin-top:4px}
#result.y{background:var(--y);color:#2a2000}
#result.b{background:var(--b)}
#result.g{background:var(--g)}
#result.r{background:var(--r)}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.bar{display:grid;grid-template-columns:1fr 56px;gap:4px 8px;align-items:center;margin:8px 0;font-size:.95rem}
.track{grid-column:1/-1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .15s}
#msg{color:var(--r);margin-top:8px;min-height:1.4em}
.note{color:var(--mute);font-size:.85rem;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>ระบบคัดแยกขยะด้วย AI</h1>
  <p class="sub">ถือขยะให้อยู่หน้ากล้อง หรืออัปโหลดรูป แล้ว AI จะบอกว่าควรทิ้งถังไหน</p>

  <div class="tabs" role="group" aria-label="เลือกโหมด">
    <button id="tabCam" aria-pressed="true">ใช้กล้อง</button>
    <button id="tabUp" aria-pressed="false">อัปโหลดรูป</button>
  </div>

  <section class="stage">
    <div id="view"><span id="placeholder">กำลังโหลดโมเดล…</span></div>
    <div class="row" id="camCtl">
      <button class="btn" id="startBtn" disabled>เปิดกล้อง</button>
      <button class="btn alt" id="flipBtn" disabled>สลับกล้องหน้า/หลัง</button>
    </div>
    <div class="row" id="upCtl" hidden>
      <label class="btn" for="file">เลือกรูปขยะ</label>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div id="msg" role="alert"></div>
  </section>

  <div id="result" aria-live="polite">
    <div class="big">รอผลการทาย</div>
    <div class="pct">เปิดกล้องหรืออัปโหลดรูปเพื่อเริ่ม</div>
  </div>

  <section class="bars" id="bars" aria-label="ความมั่นใจของแต่ละประเภท"></section>
  <p class="note">AI ทายได้เฉพาะประเภทที่เคยเรียนรู้จากรูปตัวอย่าง หากความมั่นใจต่ำกว่า 70% ระบบจะแจ้งว่าไม่แน่ใจ</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
// ลิงก์โมเดลจาก Teachable Machine (ถ้าเทรนใหม่แล้วอัปโหลดใหม่ ให้เปลี่ยนลิงก์ตรงนี้)
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/UPmit2Vpm/";
const THRESHOLD = 0.7;

let model, webcam, running = false, facing = "user", mode = "cam";
const $ = id => document.getElementById(id);

function colorOf(name){
  if(name.includes("ไม่มีขยะ")) return "";
  if(name.includes("เหลือง")||name.includes("รีไซเคิล")) return "y";
  if(name.includes("น้ำเงิน")||name.includes("ทั่วไป")) return "b";
  if(name.includes("เขียว")||name.includes("อินทรีย์")) return "g";
  if(name.includes("แดง")||name.includes("อันตราย")) return "r";
  return "";
}

function showResult(preds){
  preds.forEach((p,i)=>{
    $("pct"+i).textContent=(p.probability*100).toFixed(0)+"%";
    $("fill"+i).style.width=(p.probability*100)+"%";
  });
  const top = preds.reduce((a,b)=>a.probability>b.probability?a:b);
  const r = $("result");
  const pct = (top.probability*100).toFixed(0);
  if(top.probability < THRESHOLD){
    r.className=""; r.innerHTML='<div class="big">ไม่แน่ใจ</div><div class="pct">ลองหมุนขยะหรือเพิ่มแสง (สูงสุด '+pct+'%)</div>';
  } else if(top.className.includes("ไม่มีขยะ")){
    r.className=""; r.innerHTML='<div class="big">ไม่พบขยะ</div><div class="pct">นำขยะมาไว้หน้ากล้อง</div>';
  } else {
    r.className=colorOf(top.className);
    r.innerHTML='<div class="big"></div><div class="pct">ทิ้งถังนี้ · ความมั่นใจ '+pct+'%</div>';
    r.querySelector(".big").textContent=top.className;
  }
}

async function loop(){
  if(!running) return;
  webcam.update();
  showResult(await model.predict(webcam.canvas));
  requestAnimationFrame(loop);
}

async function startCam(){
  $("msg").textContent="";
  await stopCam();
  try{
    webcam = new tmImage.Webcam(400,400,facing==="user");
    await webcam.setup({facingMode:facing});
    await webcam.play();
    $("view").innerHTML=""; $("view").appendChild(webcam.canvas);
    running=true; $("startBtn").textContent="ปิดกล้อง";
    requestAnimationFrame(loop);
  }catch(e){
    $("msg").textContent="เปิดกล้องไม่ได้: กดไอคอนข้างช่อง URL แล้วอนุญาตกล้อง หรือปิดโปรแกรมที่ใช้กล้องอยู่ ถ้ายังไม่ได้ให้ใช้โหมดอัปโหลดรูปแทน";
  }
}
async function stopCam(){
  running=false;
  if(webcam){ try{ await webcam.stop(); }catch(_){} webcam=null; }
  $("startBtn").textContent="เปิดกล้อง";
}

function setMode(m){
  mode=m;
  $("tabCam").setAttribute("aria-pressed",m==="cam");
  $("tabUp").setAttribute("aria-pressed",m==="up");
  $("camCtl").hidden = m!=="cam"; $("upCtl").hidden = m!=="up";
  if(m==="up"){ stopCam(); $("view").innerHTML="<span>ยังไม่ได้เลือกรูป</span>"; }
  else { $("view").innerHTML="<span>กด “เปิดกล้อง” เพื่อเริ่ม</span>"; }
  $("msg").textContent="";
}

$("tabCam").onclick=()=>setMode("cam");
$("tabUp").onclick=()=>setMode("up");
$("startBtn").onclick=()=> running ? (stopCam(), $("view").innerHTML="<span>ปิดกล้องแล้ว</span>") : startCam();
$("flipBtn").onclick=()=>{ facing = facing==="user"?"environment":"user"; if(running) startCam(); };
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=async()=>{
    $("view").innerHTML=""; $("view").appendChild(img);
    showResult(await model.predict(img));
  };
  img.src=URL.createObjectURL(f);
};

(async function init(){
  try{
    model = await tmImage.load(MODEL_URL+"model.json", MODEL_URL+"metadata.json");
    const labels = model.getClassLabels();
    $("bars").innerHTML = labels.map((l,i)=>
      '<div class="bar"><span id="name'+i+'"></span><span id="pct'+i+'">0%</span><div class="track"><div class="fill" id="fill'+i+'"></div></div></div>').join("");
    labels.forEach((l,i)=>$("name"+i).textContent=l);
    $("startBtn").disabled=false; $("flipBtn").disabled=false;
    $("view").innerHTML="<span>กด “เปิดกล้อง” เพื่อเริ่ม</span>";
  }catch(e){
    $("view").innerHTML="";
    $("msg").textContent="โหลดโมเดลไม่ได้ ตรวจสอบอินเทอร์เน็ต และลิงก์ MODEL_URL ในโค้ด";
  }
})();
</script>
</body>
</html>
